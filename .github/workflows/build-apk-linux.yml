name: Build APK (Linux)

# 为什么单独一条：上游 build-manager.yml 跑在 windows-latest，
# 它的 native 任务（buildJailbreakProviders / buildModuleTools / buildModulePolicy）
# 在 Windows 上 Python 退出码 1，连上游自己也是三次全失败（没有 release）。
# CMake + NDK + Python 在 Linux 上是原生支持的，所以这里重开一条 Linux 流水线。

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Build variant
        type: choice
        options:
          - release
          - debug
        default: release
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Android SDK packages
        run: |
          set -eu
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "SDK=$SDK"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-37.0' \
            'build-tools;37.0.0' \
            'cmake;3.22.1' \
            'ndk;26.1.10909125' \
            'ndk;28.2.13676358' \
            'ndk;29.0.14206865'
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Install Python native requirements
        run: |
          set -eu
          python -m pip install --upgrade pip
          python -m pip install -r requirements-native.txt
          echo "MAPLESU_PYTHON=$(command -v python3)" >> "$GITHUB_ENV"

      - name: Source gates
        run: |
          set -eu
          python .handoff/source_snapshot.py verify --repair || echo "::warning::source_snapshot verify failed"
          python tools/check_source_export.py || echo "::warning::check_source_export failed"
          python tools/prepare_native_inputs.py --check || echo "::warning::prepare_native_inputs failed"
          python scripts/sync-ultra-sdk-identity.py --check || echo "::warning::sync-ultra-sdk-identity failed"

      - name: Rust targets
        run: |
          set -eu
          rustup target add aarch64-linux-android x86_64-linux-android || true
          cargo --version
          rustc --version
      - name: Signing config
        run: |
          set -eu
          mkdir -p manager
          KEYSTORE="$RUNNER_TEMP/maplesu-release.jks"
          if [ -f manager/ci/release.jks ]; then
            cp manager/ci/release.jks "$KEYSTORE"
            echo "keystore: builtin manager/ci/release.jks"
          else
            keytool -genkeypair -keystore "$KEYSTORE" -alias starfox \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass starfox123 -keypass starfox123 \
              -dname "CN=StarFox,O=StarFox,C=CN" -noprompt
            echo "::warning::ephemeral keystore"
          fi
          {
            echo "KEYSTORE_FILE=$KEYSTORE"
            echo "KEYSTORE_PASSWORD=starfox123"
            echo "KEY_ALIAS=starfox"
            echo "KEY_PASSWORD=starfox123"
          } > manager/sign.properties
          ls -l "$KEYSTORE"
          cat manager/sign.properties

      - name: Warm host jars through Gradle
        run: |
          set -eu
          # The runner cannot reach Maven directly (curl gets 404), but Gradle
          # can. A detached configuration makes Gradle resolve exactly the six
          # jars tools/specgen/specgen/product.py looks up in its own cache.
          cat > /tmp/warm.gradle <<'GRADLE'
          gradle.rootProject { project ->
              project.tasks.register("warmHostJars") {
                  doLast {
                      def coords = [
                          "org.jetbrains.kotlin:kotlin-stdlib:2.4.20",
                          "org.jetbrains:annotations:13.0",
                          "org.jetbrains.kotlinx:kotlinx-serialization-json-jvm:1.11.0",
                          "org.jetbrains.kotlinx:kotlinx-serialization-core-jvm:1.11.0",
                          "org.jetbrains.kotlin:kotlin-compiler-embeddable:2.4.20",
                          "org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm:1.11.0",
                      ]
                      def deps = coords.collect { project.dependencies.create(it) }
                      def cfg = project.configurations.detachedConfiguration(deps as org.gradle.api.artifacts.Dependency[])
                      cfg.canBeResolved = true
                      cfg.files.each { println "WARM " + it }
                  }
              }
          }
          GRADLE
          ./gradlew --init-script /tmp/warm.gradle warmHostJars --no-daemon 2>&1 | tail -30 || true
          CACHE="${GRADLE_USER_HOME:-$HOME/.gradle}/caches/modules-2/files-2.1"
          echo "=== kotlin-stdlib in cache ==="
          find "$CACHE/org.jetbrains.kotlin/kotlin-stdlib" -name '*.jar' 2>/dev/null | head -5 || echo "  (none)"
          echo "=== annotations / serialization / coroutines ==="
          find "$CACHE" \( -path '*org.jetbrains/annotations*' -o -path '*kotlinx-serialization*' -o -path '*kotlinx-coroutines-core-jvm*' \) -name '*.jar' 2>/dev/null | head -8 || true
      - name: Build shark plants
        run: |
          set -eu
          # build.py never invokes this, but package.py verifies every plant
          # digest before it will package an APK. Compile the seven C plants
          # with the pinned NDK 28.2 so the manifest matches what ships.
          NDK28="$ANDROID_SDK_ROOT/ndk/28.2.13676358"
          echo "ndk: $NDK28"
          ls "$NDK28/toolchains/llvm/prebuilt" || true
          python jailbreak-providers/shark/build_plants.py --ndk "$NDK28"
          echo "=== plants ==="
          ls -l jailbreak-providers/shark/plants/arm64-v8a/ || true
          echo "=== manifest plants record ==="
          python - <<'PY'
          import json
          d=json.load(open('jailbreak-providers/shark/manifest.json'))
          for p in d.get('plants') or []:
              print(' ', p['name'], p['bytes'], p['sha256'][:16])
          PY
      - name: Debug provider build (verbose)
        run: |
          set -x
          NDK="$ANDROID_SDK_ROOT/ndk/26.1.10909125"
          echo "SDK=$ANDROID_SDK_ROOT"
          ls "$ANDROID_SDK_ROOT/cmake/3.22.1/bin" || true
          ls "$NDK/toolchains/llvm/prebuilt" || true
          which cargo rustc || true
          cargo --version || true
          echo "=== run build.py directly ==="
          rm -rf /tmp/providers
          python jailbreak-providers/build.py \
            --dirtyfrag-adapter --ghostlock-adapter \
            --ko-variant minimal \
            --sdk "$ANDROID_SDK_ROOT" \
            --ndk-dir "$NDK" \
            --output /tmp/providers > /tmp/pb.log 2>&1 || true
          echo "=== PB.LOG ==="
          tail -40 /tmp/pb.log || true
          echo "=== BUILD.LOG (compiler errors) ==="
          tail -120 /tmp/providers/build.log 2>/dev/null || echo "no build.log"
          echo "=== BUILD.JSON ==="
          cat /tmp/providers/build.json 2>/dev/null | head -c 3000 || echo "no build.json"
      - name: Build manager
        env:
          MAPLE_RELEASE_STORE_FILE: ${{ runner.temp }}/maplesu-release.jks
          MAPLE_RELEASE_STORE_PASSWORD: starfox123
          MAPLE_RELEASE_KEY_ALIAS: starfox
          MAPLE_RELEASE_KEY_PASSWORD: starfox123
        run: |
          set -eu
          VARIANT="${{ inputs.variant }}"
          if [ "$VARIANT" = "release" ]; then
            ./gradlew :manager:assembleRelease --no-daemon --no-build-cache --max-workers=2 --stacktrace
          else
            ./gradlew :manager:assembleDebug --no-daemon --no-build-cache --max-workers=2 --stacktrace
          fi

      - name: Collect APK
        if: always()
        run: |
          set -eu
          mkdir -p out
          find manager/build/outputs/apk -name '*.apk' -exec cp -v {} out/ \; || true
          ls -l out || true

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maplesu-apk-${{ github.sha }}
          path: out/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maplesu-apk-failure-logs
          path: |
            manager/build/reports/**
            manager/build/outputs/logs/**
            **/build/*.log
          if-no-files-found: ignore
          retention-days: 7
